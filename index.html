<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortex — Estudo com IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#0B0F14;
  --surface:#121821;
  --surface-2:#1A2230;
  --border:#232C3A;
  --text:#E7ECF2;
  --text-dim:#8B97A8;
  --accent:#2FE0B8;
  --accent-dim:#1B8F72;
  --violet:#8B85FF;
  --amber:#FFB454;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  display:flex;
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3,.brand,.nav-item,.btn,.stat-num{font-family:'Space Grotesk',sans-serif;}

/* ---------- LANGUAGE MODAL ---------- */
.lang-overlay{
  position:fixed;inset:0;background:rgba(6,9,13,0.9);
  display:flex;align-items:center;justify-content:center;z-index:100;
  backdrop-filter:blur(4px);
}
.lang-card{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:36px;max-width:360px;width:90%;text-align:center;
}
.lang-card h2{font-size:19px;margin-bottom:20px;line-height:1.5;}
.lang-btn{
  display:block;width:100%;padding:14px;margin-bottom:12px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer;
  transition:border-color .15s;
}
.lang-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ---------- LOGIN ---------- */
.login-card{max-width:380px;}
.login-card h2{font-size:20px;margin-bottom:6px;}
.login-card p.sub{color:var(--text-dim);font-size:13px;margin-bottom:22px;}
.google-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;padding:12px;margin-bottom:16px;border-radius:12px;
  border:1px solid var(--border);background:#fff;color:#1f1f1f;
  font-family:'Space Grotesk',sans-serif;font-size:14.5px;font-weight:600;cursor:pointer;
}
.google-btn:hover{background:#f2f2f2;}
.divider{display:flex;align-items:center;gap:10px;color:var(--text-dim);font-size:12px;margin:14px 0;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}
.login-form{display:flex;flex-direction:column;gap:10px;text-align:left;}
.login-form input{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:11px 14px;font-family:'Inter',sans-serif;font-size:14px;
}
.login-form input:focus{outline:1px solid var(--accent);}
.login-error{color:#FF6B6B;font-size:12.5px;min-height:16px;}
.login-toggle{color:var(--text-dim);font-size:12.5px;text-align:center;margin-top:12px;cursor:pointer;}
.login-toggle span{color:var(--accent);font-weight:600;}
.logout-btn{
  width:100%;margin-top:8px;background:none;border:1px solid var(--border);color:var(--text-dim);
  border-radius:8px;padding:7px 0;font-size:11.5px;cursor:pointer;font-weight:600;
}
.logout-btn:hover{color:var(--text);border-color:var(--accent-dim);}
.user-email{font-size:11.5px;color:var(--text-dim);margin-top:10px;word-break:break-all;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:250px;
  min-width:250px;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:24px 16px;
}
.brand{
  font-size:22px;
  font-weight:700;
  letter-spacing:-0.02em;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 8px 28px 8px;
}
.brand-mark{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--violet));
  flex-shrink:0;
}
.nav{display:flex;flex-direction:column;gap:4px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;border-radius:10px;
  color:var(--text-dim);font-size:14px;font-weight:500;
  cursor:pointer;transition:background .15s,color .15s;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--surface-2);color:var(--accent);}
.sidebar-foot{
  border-top:1px solid var(--border);
  padding-top:16px;margin-top:8px;
  font-size:12px;color:var(--text-dim);
}
.lang-switch{margin-top:10px;display:flex;gap:6px;}
.lang-switch button{
  flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
  border-radius:8px;padding:6px 0;font-size:11.5px;cursor:pointer;font-weight:600;
}
.lang-switch button.active{color:var(--accent);border-color:var(--accent-dim);}

/* ---------- MAIN ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{
  height:64px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;flex-shrink:0;
}
.topbar h2{font-size:16px;font-weight:600;}
.streak{
  display:flex;align-items:center;gap:8px;
  background:var(--surface-2);border:1px solid var(--border);
  padding:6px 12px;border-radius:100px;font-size:13px;color:var(--amber);
}
.view{display:none;flex:1;overflow-y:auto;padding:32px;}
.view.active{display:flex;flex-direction:column;}

/* ---------- DASHBOARD ---------- */
.hero{
  background:radial-gradient(circle at 15% 20%, rgba(47,224,184,0.12), transparent 55%),
             radial-gradient(circle at 85% 80%, rgba(139,133,255,0.12), transparent 55%),
             var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:36px;
  margin-bottom:24px;
}
.hero h1{font-size:30px;font-weight:700;letter-spacing:-0.02em;margin-bottom:8px;}
.hero p{color:var(--text-dim);font-size:15px;max-width:520px;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;
}
.stat-num{font-size:26px;font-weight:700;color:var(--accent);}
.stat-label{font-size:12.5px;color:var(--text-dim);margin-top:4px;}
.section-title{font-size:15px;font-weight:600;margin:8px 0 14px 0;color:var(--text);}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:28px;}
.subject-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:16px;cursor:pointer;
  transition:border-color .15s,transform .15s;
}
.subject-card:hover{border-color:var(--accent-dim);transform:translateY(-2px);}
.subject-emoji{font-size:22px;margin-bottom:8px;display:block;}
.subject-name{font-size:13.5px;font-weight:600;}

/* ---------- CHAT ---------- */
.chat-wrap{flex:1;display:flex;flex-direction:column;max-width:820px;margin:0 auto;width:100%;height:100%;}
.chat-config{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;
}
.chat-config select{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:8px 12px;border-radius:9px;font-size:13px;font-family:'Inter',sans-serif;
}
.messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:8px 4px 20px 4px;}
.msg{max-width:78%;padding:12px 16px;border-radius:14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;}
.msg.user{align-self:flex-end;background:var(--violet);color:#0B0F14;border-bottom-right-radius:4px;}
.msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:4px;}
.msg.ai.loading{color:var(--text-dim);font-style:italic;}
.chat-input-row{display:flex;gap:10px;border-top:1px solid var(--border);padding-top:16px;}
.chat-input-row textarea{
  flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:12px 14px;font-family:'Inter',sans-serif;font-size:14.5px;
  resize:none;height:48px;
}
.chat-input-row textarea:focus{outline:1px solid var(--accent);}
.btn{
  background:var(--accent);color:#06231D;border:none;border-radius:12px;
  padding:0 20px;font-weight:600;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.btn:hover{background:#3EF0C8;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- IMAGE GEN ---------- */
.imggen-wrap{max-width:720px;margin:0 auto;width:100%;}
.imggen-form{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
.imggen-form textarea{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:14px;font-family:'Inter',sans-serif;font-size:14.5px;min-height:70px;resize:none;
}
.style-row{display:flex;gap:8px;flex-wrap:wrap;}
.style-chip{
  padding:7px 14px;border-radius:100px;border:1px solid var(--border);
  background:var(--surface);font-size:12.5px;cursor:pointer;color:var(--text-dim);
}
.style-chip.selected{border-color:var(--accent);color:var(--accent);}
.canvas-preview{
  min-height:220px;max-height:70vh;background:var(--surface);border:1px dashed var(--border);
  border-radius:16px;display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:13px;text-align:center;padding:20px;overflow:hidden;position:relative;
}

/* ---------- PROGRESSO ---------- */
.progress-empty{color:var(--text-dim);font-size:14px;max-width:420px;}
.progress-row{margin-bottom:4px;}
.progress-count{color:var(--text-dim);font-size:12px;}

@media(max-width:820px){
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:20;transition:left .2s;box-shadow:0 0 40px rgba(0,0,0,.5);}
  .sidebar.open{left:0;}
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .menu-btn{display:flex!important;}
}
.menu-btn{display:none;background:none;border:none;color:var(--text);cursor:pointer;}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="lang-overlay" id="loginOverlay">
  <div class="lang-card login-card">
    <h2>Entrar no Cortex</h2>
    <p class="sub">Seu progresso fica salvo na sua conta, em qualquer aparelho.</p>
    <button class="google-btn" id="googleBtn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84c-.21 1.13-.84 2.09-1.8 2.73v2.27h2.92c1.7-1.57 2.68-3.88 2.68-6.64z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.27c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.71H.96v2.34C2.44 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.7c-.18-.54-.28-1.11-.28-1.7s.1-1.16.28-1.7V4.96H.96C.35 6.17 0 7.55 0 9s.35 2.83.96 4.04l3.01-2.34z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.59-2.59C13.46.89 11.43 0 9 0 5.48 0 2.44 2.02.96 4.96l3.01 2.34C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
      Continuar com Google
    </button>
    <div class="divider">ou</div>
    <div class="login-form">
      <input type="email" id="loginEmail" placeholder="E-mail">
      <input type="password" id="loginPassword" placeholder="Senha">
      <div class="login-error" id="loginError"></div>
      <button class="lang-btn" id="loginSubmitBtn" style="margin-bottom:0;">Entrar</button>
    </div>
    <div class="login-toggle" id="loginToggle">Não tem conta? <span>Criar conta</span></div>
  </div>
</div>

<!-- LANGUAGE SELECTION (shown only once) -->
<div class="lang-overlay" id="langOverlay" style="display:none;">
  <div class="lang-card">
    <h2>Escolha seu idioma<br>Choose your language</h2>
    <button class="lang-btn" data-lang="pt">Português</button>
    <button class="lang-btn" data-lang="en">English</button>
  </div>
</div>

<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark"></div>Cortex</div>
  <nav class="nav">
    <button class="nav-item active" data-view="dashboard" data-i18n="navDashboard"></button>
    <button class="nav-item" data-view="chat" data-i18n="navChat"></button>
    <button class="nav-item" data-view="imggen" data-i18n="navImgGen"></button>
    <button class="nav-item" data-view="progresso" data-i18n="navProgress"></button>
  </nav>
  <div class="sidebar-foot">
    <div data-i18n="sidebarFoot"></div>
    <div class="lang-switch">
      <button data-lang="pt" id="langBtnPt">PT</button>
      <button data-lang="en" id="langBtnEn">EN</button>
    </div>
    <div class="user-email" id="userEmailDisplay"></div>
    <button class="logout-btn" id="logoutBtn">Sair</button>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h2 id="topbarTitle"></h2>
    </div>
    <div class="streak" id="streakDisplay"></div>
  </div>

  <!-- DASHBOARD -->
  <section class="view active" id="view-dashboard">
    <div class="hero">
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroText"></p>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="statTime">0min</div><div class="stat-label" data-i18n="statTimeLabel"></div></div>
      <div class="stat-card"><div class="stat-num" id="statSubjects">0</div><div class="stat-label" data-i18n="statSubjectsLabel"></div></div>
      <div class="stat-card"><div class="stat-num" id="statExercises">0</div><div class="stat-label" data-i18n="statExercisesLabel"></div></div>
      <div class="stat-card"><div class="stat-num" id="statAccuracy">—</div><div class="stat-label" data-i18n="statAccuracyLabel"></div></div>
    </div>
    <div class="section-title" data-i18n="chooseSubject"></div>
    <div class="subject-grid" id="subjectGrid"></div>
  </section>

  <!-- CHAT -->
  <section class="view" id="view-chat">
    <div class="chat-wrap">
      <div class="chat-config">
        <select id="cfgSubject"></select>
        <select id="cfgLevel"></select>
        <select id="cfgStyle"></select>
      </div>
      <div class="messages" id="messages"></div>
      <div id="chatImagePreview" style="display:none;position:relative;width:70px;margin-bottom:8px;">
        <img id="chatImagePreviewImg" style="width:70px;height:70px;object-fit:cover;border-radius:10px;border:1px solid var(--border);">
        <button id="chatImageRemoveBtn" style="position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:12px;">✕</button>
      </div>
      <div class="chat-input-row">
        <input type="file" id="chatImageInput" accept="image/*" style="display:none;">
        <button class="btn" id="chatAttachBtn" style="background:var(--surface-2);color:var(--text);padding:0 14px;" title="Anexar imagem">📎</button>
        <button class="btn" id="chatMicBtn" style="background:var(--surface-2);color:var(--text);padding:0 14px;" title="Falar">🎤</button>
        <textarea id="chatInput"></textarea>
        <button class="btn" id="sendBtn" data-i18n="sendBtn"></button>
      </div>
    </div>
  </section>

  <!-- IMAGE GEN -->
  <section class="view" id="view-imggen">
    <div class="imggen-wrap">
      <div class="section-title" data-i18n="imgGenTitle"></div>
      <div class="imggen-form">
        <textarea id="imgPrompt"></textarea>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <input type="file" id="refImageInput" accept="image/*" style="display:none;">
          <button class="btn" id="refImageBtn" type="button" style="background:var(--surface-2);color:var(--text);font-size:12.5px;padding:0 14px;height:36px;">🖼️ <span data-i18n="attachRefImage" style="margin-left:6px;"></span></button>
          <div id="refImagePreview" style="display:none;position:relative;width:44px;">
            <img id="refImagePreviewImg" style="width:44px;height:44px;object-fit:cover;border-radius:8px;border:1px solid var(--border);">
            <button id="refImageRemoveBtn" style="position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);cursor:pointer;font-size:11px;">✕</button>
          </div>
        </div>
        <div class="style-row" id="styleRow"></div>
        <div class="style-row" id="aspectRow" style="margin-top:2px;"></div>
        <button class="btn" id="genBtn" style="align-self:flex-start;" data-i18n="genBtnText"></button>
      </div>
      <div class="canvas-preview" id="imgPreview">
        <div data-i18n="imgPreviewDefault"></div>
      </div>
    </div>
  </section>

  <!-- PROGRESSO -->
  <section class="view" id="view-progresso">
    <div class="section-title" data-i18n="progressTitle"></div>
    <div id="progressList" style="display:flex;flex-direction:column;gap:12px;max-width:600px;"></div>
  </section>
</div>

<script>
// ---------------- TRADUÇÕES ----------------
const SUBJECT_IDS = ["math","portuguese","history","geography","science","biology","physics","chemistry","english","spanish","philosophy","sociology","literature","writing","programming","astronomy"];
const EMOJIS = {math:"📐",portuguese:"📖",history:"🏛️",geography:"🌍",science:"🔬",biology:"🧬",physics:"⚛️",chemistry:"🧪",english:"🇬🇧",spanish:"🇪🇸",philosophy:"💭",sociology:"🧑‍🤝‍🧑",literature:"📚",writing:"✍️",programming:"💻",astronomy:"🔭"};

const LEVEL_IDS = ["basic","intermediate","advanced"];
const STYLE_IDS = ["simple","detailed","summary","stepbystep"];
const IMG_STYLE_IDS = ["educational","realistic","illustration","diagram","futuristic"];
const ASPECT_IDS = ["square","portrait","landscape"];
const ASPECT_DIMENSIONS = { square: {w:1024,h:1024}, portrait: {w:896,h:1152}, landscape: {w:1152,h:896} };

const translations = {
  pt: {
    navDashboard: "📊 Painel",
    navChat: "💬 Chat de IA",
    navImgGen: "🎨 Gerador de Imagens",
    navProgress: "📈 Progresso",
    sidebarFoot: "Cortex — plataforma de estudos com IA<br>versão de demonstração",
    titles: {dashboard:"Painel", chat:"Chat de IA", imggen:"Gerador de Imagens", progresso:"Progresso"},
    heroTitle: "Bem-vindo de volta.",
    heroText: "Escolha uma matéria, defina seu tempo disponível e deixe a IA montar a explicação certa para o que você precisa agora.",
    statTimeLabel: "Tempo total de estudo",
    statSubjectsLabel: "Matérias estudadas",
    statExercisesLabel: "Exercícios feitos",
    statAccuracyLabel: "Taxa de acerto",
    chooseSubject: "Escolha uma matéria",
    chatWelcome: "Oi! Sou a IA do Cortex. Me conta o que você quer estudar hoje — pode ser uma dúvida específica, pedir um resumo, exercícios ou um plano de estudos.",
    chatPlaceholder: "Pergunte algo, ex: 'explique a Revolução Francesa de forma simples'",
    sendBtn: "Enviar",
    thinking: "Pensando...",
    chatError: "Ocorreu um erro ao falar com a IA. Verifique sua conexão e tente novamente.",
    chatNoReply: "Não consegui gerar uma resposta agora. Tente novamente.",
    imgGenTitle: "Descreva a imagem que você precisa",
    imgPlaceholder: "Ex: diagrama do ciclo da água, estilo educativo, cores suaves",
    genBtnText: "Gerar imagem",
    imgPreviewDefault: "A imagem gerada aparece aqui.",
    imgGenerating: (p)=>`Gerando imagem para:<br><strong style="color:var(--text)">"${p}"</strong>`,
    imgGenericError: "Não foi possível gerar a imagem. Tente novamente.",
    imgConnError: "Erro de conexão com o servidor de geração de imagens.",
    progressTitle: "Seu progresso por matéria",
    progressEmpty: "Você ainda não estudou nenhuma matéria. Comece uma conversa no chat para ver seu progresso real aparecer aqui.",
    interactions: (n)=> n===1 ? "1 interação no chat" : `${n} interações no chat`,
    streak: (n)=> n===1 ? "🔥 1 dia seguido estudando" : `🔥 ${n} dias seguidos estudando`,
    levels: {basic:"Nível básico", intermediate:"Nível intermediário", advanced:"Nível avançado"},
    styles: {simple:"Explicação simples", detailed:"Explicação detalhada", summary:"Resumo direto", stepbystep:"Passo a passo"},

async function loadProgressFromCloud(){
  try{
    const doc = await db.collection('users').doc(currentUser.uid).get();
    if(doc.exists){
      const data = doc.data();
      lsSet('total_seconds', data.seconds || 0);
      lsSet('subject_counts', JSON.stringify(data.subjectCounts || {}));
      lsSet('exercises_done', data.exercises || 0);
      lsSet('last_visit_date', data.lastVisit || '');
      lsSet('streak_days', data.streak || 0);
    }
  }catch(err){
    console.error('Não foi possível carregar o progresso da nuvem:', err);
  }
}

function saveProgressToCloud(){
  if(!currentUser) return;
  db.collection('users').doc(currentUser.uid).set({
    seconds: parseInt(lsGet('total_seconds') || '0', 10),
    subjectCounts: getSubjectCounts(),
    exercises: parseInt(lsGet('exercises_done') || '0', 10),
    lastVisit: lsGet('last_visit_date') || '',
    streak: parseInt(lsGet('streak_days') || '0', 10),
    email: currentUser.email || null,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).catch(err=> console.error('Erro ao salvar na nuvem:', err));
}

// ---------------- ARMAZENAMENTO REAL DE PROGRESSO ----------------
const STORAGE_KEYS = {
  seconds: 'total_seconds',
  subjectCounts: 'subject_counts',
  exercises: 'exercises_done',
  lastVisit: 'last_visit_date',
  streak: 'streak_days'
};

function getSubjectCounts(){
  try{ return JSON.parse(lsGet(STORAGE_KEYS.subjectCounts) || '{}'); }
  catch(e){ return {}; }
}

function incrementSubjectCount(subjectId){
  const counts = getSubjectCounts();
  counts[subjectId] = (counts[subjectId] || 0) + 1;
  lsSet(STORAGE_KEYS.subjectCounts, JSON.stringify(counts));
  refreshDashboardStats();
  renderProgressList();
  saveProgressToCloud();
}

function formatStudyTime(totalSeconds){
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  if(h > 0) return `${h}h${m.toString().padStart(2,'0')}`;
  if(m > 0) return `${m}min`;
  return `${totalSeconds}s`;
}

function todayStr(){ return new Date().toISOString().slice(0,10); }

function updateStreak(){
  const today = todayStr();
  const lastVisit = lsGet(STORAGE_KEYS.lastVisit);
  let streak = parseInt(lsGet(STORAGE_KEYS.streak) || '0', 10);

  if(lastVisit !== today){
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    streak = (lastVisit === yesterday) ? streak + 1 : 1;
    lsSet(STORAGE_KEYS.lastVisit, today);
    lsSet(STORAGE_KEYS.streak, streak);
    saveProgressToCloud();
  }
  document.getElementById('streakDisplay').textContent = t().streak(streak);
}

function refreshDashboardStats(){
  const seconds = parseInt(lsGet(STORAGE_KEYS.seconds) || '0', 10);
  const counts = getSubjectCounts();
  const studiedCount = Object.keys(counts).filter(id => counts[id] > 0).length;
  document.getElementById('statTime').textContent = formatStudyTime(seconds);
  document.getElementById('statSubjects').textContent = studiedCount;
  document.getElementById('statExercises').textContent = lsGet(STORAGE_KEYS.exercises) || '0';
  document.getElementById('statAccuracy').textContent = '—';
}

// Progresso por matéria = baseado em interações reais no chat, não em número aleatório
function renderProgressList(){
  const progressList = document.getElementById('progressList');
  progressList.innerHTML = '';
  const counts = getSubjectCounts();
  const studied = SUBJECT_IDS.filter(id => counts[id] > 0)
    .sort((a,b)=> counts[b] - counts[a]);

  if(studied.length === 0){
    const empty = document.createElement('div');
    empty.className = 'progress-empty';
    empty.textContent = t().progressEmpty;
    progressList.appendChild(empty);
    return;
  }

  studied.forEach(id=>{
    const count = counts[id];
    const pct = Math.min(100, count * 10); // cada interação = 10% até o teto de 100%
    const row = document.createElement('div');
    row.className = 'progress-row';
    row.innerHTML = `
      <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;">
        <span>${EMOJIS[id]} ${t().subjects[id]}</span>
        <span class="progress-count">${t().interactions(count)}</span>
      </div>
      <div style="height:8px;background:var(--surface-2);border-radius:100px;overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--accent),var(--violet));"></div>
      </div>`;
    progressList.appendChild(row);
  });
}

let studyTimerStarted = false;
function startStudyTimer(){
  if(studyTimerStarted) return;
  studyTimerStarted = true;
  studySeconds = parseInt(lsGet(STORAGE_KEYS.seconds) || '0', 10);
  setInterval(()=>{
    if(document.visibilityState === 'visible' && currentUser){
      studySeconds++;
      lsSet(STORAGE_KEYS.seconds, studySeconds);
      const el = document.getElementById('statTime');
      if(el) el.textContent = formatStudyTime(studySeconds);

  }, 1000);
}

// Limpa símbolos de Markdown/LaTeX que às vezes escapam da instrução do sistema,
// e transforma o que sobrar em HTML simples e legível.
function formatAiMessage(raw){
  // 1) escapa HTML para não quebrar o layout nem permitir injeção
  let text = raw
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // 2) troca símbolos de LaTeX comuns por texto/matemática simples
  text = text
    .replace(/\\\(|\\\)|\\\[|\\\]/g, '')
    .replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g, '($1/$2)')
    .replace(/\\sqrt\{([^{}]+)\}/g, '√($1)')
    .replace(/\\times/g, '×')
    .replace(/\\cdot/g, '·')
    .replace(/\\div/g, '÷')
    .replace(/\\pm/g, '±')
    .replace(/\\neq/g, '≠')
    .replace(/\\leq|\\le\b/g, '≤')
    .replace(/\\geq|\\ge\b/g, '≥')
    .replace(/\\pi/g, 'π')
    .replace(/\\infty/g, '∞')
    .replace(/\^\{([^{}]+)\}/g, '^$1')
    .replace(/\\[a-zA-Z]+/g, ''); // remove qualquer outro comando LaTeX que sobrar

  // 3) converte **negrito** em <strong>
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

  // 4) converte listas com "- " ou "* " no início da linha em <ul><li>
  const lines = text.split('\n');
  let html = '';
  let inList = false;
  for(const line of lines){
    const bulletMatch = line.match(/^\s*[-*]\s+(.*)/);
    if(bulletMatch){
      if(!inList){ html += '<ul style="margin:6px 0 6px 18px;padding:0;">'; inList = true; }
      html += `<li>${bulletMatch[1]}</li>`;
    } else {
      if(inList){ html += '</ul>'; inList = false; }
      html += (line === '' ? '<br>' : line + '<br>');
    }
  }
  if(inList) html += '</ul>';

  return html;
}

// ---- Anexar imagem no chat ----
let pendingChatImage = null; // { dataUrl, base64, mimeType }

function resizeImageToBase64(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > maxSize || height > maxSize){
          const ratio = Math.min(maxSize / width, maxSize / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        resolve({ dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

document.getElementById('chatAttachBtn').onclick = ()=> document.getElementById('chatImageInput').click();
document.getElementById('chatImageInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  pendingChatImage = await resizeImageToBase64(file, 1024);
  document.getElementById('chatImagePreviewImg').src = pendingChatImage.dataUrl;
  document.getElementById('chatImagePreview').style.display = 'block';
  e.target.value = '';
});
document.getElementById('chatImageRemoveBtn').onclick = ()=>{
  pendingChatImage = null;
  document.getElementById('chatImagePreview').style.display = 'none';
};

// ---- Entrada por voz (Web Speech API) ----
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognizer = null;
let isListening = false;
const micBtn = document.getElementById('chatMicBtn');

if(SpeechRecognitionAPI){
  recognizer = new SpeechRecognitionAPI();
  recognizer.continuous = false;
  recognizer.interimResults = false;
  recognizer.onstart = ()=>{ isListening = true; micBtn.textContent = '🔴'; micBtn.title = t().micListening; };
  recognizer.onend = ()=>{ isListening = false; micBtn.textContent = '🎤'; };
  recognizer.onerror = (event)=>{
    isListening = false;
    micBtn.textContent = '🎤';
    const reasons = {
      'not-allowed': lang === 'en'
        ? 'Microphone permission denied. Check Safari site settings.'
        : 'Permissão de microfone negada. Verifique as configurações do site no Safari (ícone "aA" na barra de endereço → Configurações do Site → Microfone → Permitir).',
      'no-speech': t().micError,
      'audio-capture': lang === 'en'
        ? 'No microphone found on this device.'
        : 'Nenhum microfone encontrado neste aparelho.',
      'network': lang === 'en'
        ? 'Network error while recognizing speech. Check your connection.'
        : 'Erro de rede ao reconhecer a fala. Verifique sua conexão.'
    };
    alert(reasons[event.error] || `${t().micError} (${event.error})`);
  };
  recognizer.onresult = (event)=>{
    const transcript = event.results[0][0].transcript;
    chatInput.value = (chatInput.value ? chatInput.value + ' ' : '') + transcript;
  };
}

micBtn.onclick = ()=>{
  if(!SpeechRecognitionAPI){ alert(t().micNotSupported); return; }
  if(isListening){ recognizer.stop(); return; }
  recognizer.lang = (lang === 'en') ? 'en-US' : 'pt-BR';
  recognizer.start();
};

async function sendMessage(){
  const text = chatInput.value.trim();
  if(!text) return;
  const subjectId = document.getElementById('cfgSubject').value || SUBJECT_IDS[0];
  const levelId = document.getElementById('cfgLevel').value || LEVEL_IDS[0];
  const styleId = document.getElementById('cfgStyle').value || STYLE_IDS[0];

  const imageToSend = pendingChatImage;
  addMsg(text, 'user', imageToSend ? imageToSend.dataUrl : null);
  incrementSubjectCount(subjectId);
  history.push({role:'user', content: text});
  chatInput.value = '';
  pendingChatImage = null;
  document.getElementById('chatImagePreview').style.display = 'none';
  sendBtn.disabled = true;
  const loadingEl = addMsg(t().thinking, 'ai loading');

  const subjectName = t().subjects[subjectId];
  const levelName = t().levels[levelId];
  const styleName = t().styles[styleId];
  const systemPrompt = `Você é a IA de estudos da plataforma Cortex, criada por Luca. Se o aluno perguntar quem te criou ou quem é seu criador, responda que foi criado por Luca. O aluno está estudando "${subjectName}", no ${levelName.toLowerCase()}, e pediu o estilo: ${styleName.toLowerCase()}. ${t().langInstruction} Seja claro, didático e adaptado a esse nível e estilo. Pode incluir exercícios, resumos ou explicações passo a passo quando fizer sentido. Se o aluno mandar uma imagem (foto de exercício, página do material, gráfico, etc.), use-a como contexto principal da pergunta. IMPORTANTE sobre formatação: escreva em texto simples, SEM Markdown e SEM LaTeX — nada de "**negrito**", "_itálico_", "\\frac{}{}", "\\times", cifrões de fórmula ($...$) ou colchetes de equação. Escreva contas e símbolos matemáticos direto no texto, como uma pessoa escreveria à mão: "3 x 4 = 12", "x²", "√16", "1/2". Pode usar linhas com "-" no início para listas simples quando fizer sentido.`;

  try{
    const body = { systemPrompt, messages: history };
    if(imageToSend){ body.image = { data: imageToSend.base64, mimeType: imageToSend.mimeType }; }

    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await response.json();
    loadingEl.remove();
    if(!response.ok || !data.reply){
      addMsg(data.error || t().chatNoReply, 'ai');
    } else {
      addMsg(data.reply, 'ai');
      history.push({role:'assistant', content: data.reply});
    }
  }catch(err){
    loadingEl.remove();
    addMsg(t().chatError, 'ai');
  }finally{
    sendBtn.disabled = false;
  }
}
sendBtn.onclick = sendMessage;
chatInput.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});

  startStudyTimer();
  updateStreak();
  refreshDashboardStats();

  if(lang){
    document.getElementById('langOverlay').style.display = 'none';
    applyTranslations();
  } else {
    lang = 'pt'; // valor temporário só para não quebrar leituras de t() antes da escolha
    document.getElementById('langOverlay').style.display = 'flex';
  }
}
