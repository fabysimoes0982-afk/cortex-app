<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cortex — Estudo com IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F14;
  --surface:#121821;
  --surface-2:#1A2230;
  --border:#232C3A;
  --text:#E7ECF2;
  --text-dim:#8B97A8;
  --accent:#2FE0B8;
  --accent-dim:#1B8F72;
  --violet:#8B85FF;
  --amber:#FFB454;
  --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  display:flex;
  min-height:100vh;
  overflow-x:hidden;
}
h1,h2,h3,.brand,.nav-item,.btn,.stat-num{font-family:'Space Grotesk',sans-serif;}

/* ---------- LANGUAGE MODAL ---------- */
.lang-overlay{
  position:fixed;inset:0;background:rgba(6,9,13,0.9);
  display:flex;align-items:center;justify-content:center;z-index:100;
  backdrop-filter:blur(4px);
}
.lang-card{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:36px;max-width:360px;width:90%;text-align:center;
}
.lang-card h2{font-size:19px;margin-bottom:20px;line-height:1.5;}
.lang-btn{
  display:block;width:100%;padding:14px;margin-bottom:12px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface-2);color:var(--text);
  font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;cursor:pointer;
  transition:border-color .15s;
}
.lang-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:250px;
  min-width:250px;
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:24px 16px;
}
.brand{
  font-size:22px;
  font-weight:700;
  letter-spacing:-0.02em;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 8px 28px 8px;
}
.brand-mark{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),var(--violet));
  flex-shrink:0;
}
.nav{display:flex;flex-direction:column;gap:4px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 12px;border-radius:10px;
  color:var(--text-dim);font-size:14px;font-weight:500;
  cursor:pointer;transition:background .15s,color .15s;
  border:none;background:none;width:100%;text-align:left;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--surface-2);color:var(--accent);}
.sidebar-foot{
  border-top:1px solid var(--border);
  padding-top:16px;margin-top:8px;
  font-size:12px;color:var(--text-dim);
}
.lang-switch{margin-top:10px;display:flex;gap:6px;}
.lang-switch button{
  flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text-dim);
  border-radius:8px;padding:6px 0;font-size:11.5px;cursor:pointer;font-weight:600;
}
.lang-switch button.active{color:var(--accent);border-color:var(--accent-dim);}

/* ---------- MAIN ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{
  height:64px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 28px;flex-shrink:0;
}
.topbar h2{font-size:16px;font-weight:600;}
.streak{
  display:flex;align-items:center;gap:8px;
  background:var(--surface-2);border:1px solid var(--border);
  padding:6px 12px;border-radius:100px;font-size:13px;color:var(--amber);
}
.view{display:none;flex:1;overflow-y:auto;padding:32px;}
.view.active{display:flex;flex-direction:column;}

/* ---------- DASHBOARD ---------- */
.hero{
  background:radial-gradient(circle at 15% 20%, rgba(47,224,184,0.12), transparent 55%),
             radial-gradient(circle at 85% 80%, rgba(139,133,255,0.12), transparent 55%),
             var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:36px;
  margin-bottom:24px;
}
.hero h1{font-size:30px;font-weight:700;letter-spacing:-0.02em;margin-bottom:8px;}
.hero p{color:var(--text-dim);font-size:15px;max-width:520px;}
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px;
}
.stat-num{font-size:26px;font-weight:700;color:var(--accent);}
.stat-label{font-size:12.5px;color:var(--text-dim);margin-top:4px;}
.section-title{font-size:15px;font-weight:600;margin:8px 0 14px 0;color:var(--text);}
.subject-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:28px;}
.subject-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;padding:16px;cursor:pointer;
  transition:border-color .15s,transform .15s;
}
.subject-card:hover{border-color:var(--accent-dim);transform:translateY(-2px);}
.subject-emoji{font-size:22px;margin-bottom:8px;display:block;}
.subject-name{font-size:13.5px;font-weight:600;}

/* ---------- CHAT ---------- */
.chat-wrap{flex:1;display:flex;flex-direction:column;max-width:820px;margin:0 auto;width:100%;height:100%;}
.chat-config{
  display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;
}
.chat-config select{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  padding:8px 12px;border-radius:9px;font-size:13px;font-family:'Inter',sans-serif;
}
.messages{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:16px;padding:8px 4px 20px 4px;}
.msg{max-width:78%;padding:12px 16px;border-radius:14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;}
.msg.user{align-self:flex-end;background:var(--violet);color:#0B0F14;border-bottom-right-radius:4px;}
.msg.ai{align-self:flex-start;background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:4px;}
.msg.ai.loading{color:var(--text-dim);font-style:italic;}
.chat-input-row{display:flex;gap:10px;border-top:1px solid var(--border);padding-top:16px;}
.chat-input-row textarea{
  flex:1;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:12px 14px;font-family:'Inter',sans-serif;font-size:14.5px;
  resize:none;height:48px;
}
.chat-input-row textarea:focus{outline:1px solid var(--accent);}
.btn{
  background:var(--accent);color:#06231D;border:none;border-radius:12px;
  padding:0 20px;font-weight:600;font-size:14px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.btn:hover{background:#3EF0C8;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ---------- IMAGE GEN ---------- */
.imggen-wrap{max-width:720px;margin:0 auto;width:100%;}
.imggen-form{display:flex;flex-direction:column;gap:12px;margin-bottom:20px;}
.imggen-form textarea{
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  border-radius:12px;padding:14px;font-family:'Inter',sans-serif;font-size:14.5px;min-height:70px;resize:none;
}
.style-row{display:flex;gap:8px;flex-wrap:wrap;}
.style-chip{
  padding:7px 14px;border-radius:100px;border:1px solid var(--border);
  background:var(--surface);font-size:12.5px;cursor:pointer;color:var(--text-dim);
}
.style-chip.selected{border-color:var(--accent);color:var(--accent);}
.canvas-preview{
  aspect-ratio:16/10;background:var(--surface);border:1px dashed var(--border);
  border-radius:16px;display:flex;align-items:center;justify-content:center;
  color:var(--text-dim);font-size:13px;text-align:center;padding:20px;overflow:hidden;position:relative;
}

/* ---------- PROGRESSO ---------- */
.progress-empty{color:var(--text-dim);font-size:14px;max-width:420px;}
.progress-row{margin-bottom:4px;}
.progress-count{color:var(--text-dim);font-size:12px;}

@media(max-width:820px){
  .sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:20;transition:left .2s;box-shadow:0 0 40px rgba(0,0,0,.5);}
  .sidebar.open{left:0;}
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .menu-btn{display:flex!important;}
}
.menu-btn{display:none;background:none;border:none;color:var(--text);cursor:pointer;}
</style>
</head>
<body>

<!-- LANGUAGE SELECTION (shown only once) -->
<div class="lang-overlay" id="langOverlay">
  <div class="lang-card">
    <h2>Escolha seu idioma<br>Choose your language</h2>
    <button class="lang-btn" data-lang="pt">Português</button>
    <button class="lang-btn" data-lang="en">English</button>
  </div>
</div>

<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark"></div>Cortex</div>
  <nav class="nav">
    <button class="nav-item active" data-view="dashboard" data-i18n="navDashboard"></button>
    <button class="nav-item" data-view="chat" data-i18n="navChat"></button>
    <button class="nav-item" data-view="imggen" data-i18n="navImgGen"></button>
    <button class="nav-item" data-view="progresso" data-i18n="navProgress"></button>
  </nav>
  <div class="sidebar-foot">
    <div data-i18n="sidebarFoot"></div>
    <div class="lang-switch">
      <button data-lang="pt" id="langBtnPt">PT</button>
      <button data-lang="en" id="langBtnEn">EN</button>
    </div>
  </div>
</aside>

<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px;">
      <button class="menu-btn" id="menuBtn">☰</button>
      <h2 id="topbarTitle"></h2>
    </div>
    <div class="streak" id="streakDisplay"></div>
  </div>

  <!-- DASHBOARD -->
  <section class="view active" id="view-dashboard">
    <div class="hero">
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroText"></p>
    </div>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-num" id="statTime">0min</div><div class="stat-label" data-i18n="statTimeLabel"></div></div>
      <div class="stat-card"><div class="stat-num" id="statSubjects">0</div><div class="stat-label" data-i18n="statSubjectsLabel"></div></div>
      <div class="stat-card"><div class="stat-num" id="statExercises">0</div><div class="stat-label" data-i18n="statExercisesLabel"></div></div>
      <div class="stat-card"><div class="stat-num" id="statAccuracy">—</div><div class="stat-label" data-i18n="statAccuracyLabel"></div></div>
    </div>
    <div class="section-title" data-i18n="chooseSubject"></div>
    <div class="subject-grid" id="subjectGrid"></div>
  </section>

  <!-- CHAT -->
  <section class="view" id="view-chat">
    <div class="chat-wrap">
      <div class="chat-config">
        <select id="cfgSubject"></select>
        <select id="cfgLevel"></select>
        <select id="cfgStyle"></select>
      </div>
      <div class="messages" id="messages"></div>
      <div class="chat-input-row">
        <textarea id="chatInput"></textarea>
        <button class="btn" id="sendBtn" data-i18n="sendBtn"></button>
      </div>
    </div>
  </section>

  <!-- IMAGE GEN -->
  <section class="view" id="view-imggen">
    <div class="imggen-wrap">
      <div class="section-title" data-i18n="imgGenTitle"></div>
      <div class="imggen-form">
        <textarea id="imgPrompt"></textarea>
        <div class="style-row" id="styleRow"></div>
        <button class="btn" id="genBtn" style="align-self:flex-start;" data-i18n="genBtnText"></button>
      </div>
      <div class="canvas-preview" id="imgPreview">
        <div data-i18n="imgPreviewDefault"></div>
      </div>
    </div>
  </section>

  <!-- PROGRESSO -->
  <section class="view" id="view-progresso">
    <div class="section-title" data-i18n="progressTitle"></div>
    <div id="progressList" style="display:flex;flex-direction:column;gap:12px;max-width:600px;"></div>
  </section>
</div>

<script>
// ---------------- TRADUÇÕES ----------------
const SUBJECT_IDS = ["math","portuguese","history","geography","science","biology","physics","chemistry","english","spanish","philosophy","sociology","literature","writing","programming","astronomy"];
const EMOJIS = {math:"📐",portuguese:"📖",history:"🏛️",geography:"🌍",science:"🔬",biology:"🧬",physics:"⚛️",chemistry:"🧪",english:"🇬🇧",spanish:"🇪🇸",philosophy:"💭",sociology:"🧑‍🤝‍🧑",literature:"📚",writing:"✍️",programming:"💻",astronomy:"🔭"};

const LEVEL_IDS = ["basic","intermediate","advanced"];
const STYLE_IDS = ["simple","detailed","summary","stepbystep"];
const IMG_STYLE_IDS = ["educational","realistic","illustration","diagram","futuristic"];

const translations = {
  pt: {
    navDashboard: "📊 Painel",
    navChat: "💬 Chat de IA",
    navImgGen: "🎨 Gerador de Imagens",
    navProgress: "📈 Progresso",
    sidebarFoot: "Cortex — plataforma de estudos com IA<br>versão de demonstração",
    titles: {dashboard:"Painel", chat:"Chat de IA", imggen:"Gerador de Imagens", progresso:"Progresso"},
    heroTitle: "Bem-vindo de volta.",
    heroText: "Escolha uma matéria, defina seu tempo disponível e deixe a IA montar a explicação certa para o que você precisa agora.",
    statTimeLabel: "Tempo total de estudo",
    statSubjectsLabel: "Matérias estudadas",
    statExercisesLabel: "Exercícios feitos",
    statAccuracyLabel: "Taxa de acerto",
    chooseSubject: "Escolha uma matéria",
    chatWelcome: "Oi! Sou a IA do Cortex. Me conta o que você quer estudar hoje — pode ser uma dúvida específica, pedir um resumo, exercícios ou um plano de estudos.",
    chatPlaceholder: "Pergunte algo, ex: 'explique a Revolução Francesa de forma simples'",
    sendBtn: "Enviar",
    thinking: "Pensando...",
    chatError: "Ocorreu um erro ao falar com a IA. Verifique sua conexão e tente novamente.",
    chatNoReply: "Não consegui gerar uma resposta agora. Tente novamente.",
    imgGenTitle: "Descreva a imagem que você precisa",
    imgPlaceholder: "Ex: diagrama do ciclo da água, estilo educativo, cores suaves",
    genBtnText: "Gerar imagem",
    imgPreviewDefault: "A imagem gerada aparece aqui.",
    imgGenerating: (p)=>`Gerando imagem para:<br><strong style="color:var(--text)">"${p}"</strong>`,
    imgGenericError: "Não foi possível gerar a imagem. Tente novamente.",
    imgConnError: "Erro de conexão com o servidor de geração de imagens.",
    progressTitle: "Seu progresso por matéria",
    progressEmpty: "Você ainda não estudou nenhuma matéria. Comece uma conversa no chat para ver seu progresso real aparecer aqui.",
    interactions: (n)=> n===1 ? "1 interação no chat" : `${n} interações no chat`,
    streak: (n)=> n===1 ? "🔥 1 dia seguido estudando" : `🔥 ${n} dias seguidos estudando`,
    levels: {basic:"Nível básico", intermediate:"Nível intermediário", advanced:"Nível avançado"},
    styles: {simple:"Explicação simples", detailed:"Explicação detalhada", summary:"Resumo direto", stepbystep:"Passo a passo"},
    imgStyles: {educational:"Educativo", realistic:"Realista", illustration:"Ilustração", diagram:"Diagrama", futuristic:"Futurista"},
    subjects: {math:"Matemática",portuguese:"Português",history:"História",geography:"Geografia",science:"Ciências",biology:"Biologia",physics:"Física",chemistry:"Química",english:"Inglês",spanish:"Espanhol",philosophy:"Filosofia",sociology:"Sociologia",literature:"Literatura",writing:"Redação",programming:"Programação",astronomy:"Astronomia"},
    langInstruction: "Responda em português do Brasil."
  },
  en: {
    navDashboard: "📊 Dashboard",
    navChat: "💬 AI Chat",
    navImgGen: "🎨 Image Generator",
    navProgress: "📈 Progress",
    sidebarFoot: "Cortex — AI study platform<br>demo version",
    titles: {dashboard:"Dashboard", chat:"AI Chat", imggen:"Image Generator", progresso:"Progress"},
    heroTitle: "Welcome back.",
    heroText: "Pick a subject, set the time you have, and let the AI build the right explanation for what you need right now.",
    statTimeLabel: "Total study time",
    statSubjectsLabel: "Subjects studied",
    statExercisesLabel: "Exercises done",
    statAccuracyLabel: "Accuracy rate",
    chooseSubject: "Choose a subject",
    chatWelcome: "Hi! I'm Cortex's AI. Tell me what you want to study today — a specific question, a summary, exercises, or a study plan.",
    chatPlaceholder: "Ask something, e.g. 'explain the French Revolution simply'",
    sendBtn: "Send",
    thinking: "Thinking...",
    chatError: "There was an error talking to the AI. Check your connection and try again.",
    chatNoReply: "I couldn't generate a reply right now. Try again.",
    imgGenTitle: "Describe the image you need",
    imgPlaceholder: "E.g.: diagram of the water cycle, educational style, soft colors",
    genBtnText: "Generate image",
    imgPreviewDefault: "The generated image will appear here.",
    imgGenerating: (p)=>`Generating image for:<br><strong style="color:var(--text)">"${p}"</strong>`,
    imgGenericError: "Could not generate the image. Try again.",
    imgConnError: "Connection error with the image generation server.",
    progressTitle: "Your progress by subject",
    progressEmpty: "You haven't studied any subject yet. Start a chat conversation to see your real progress appear here.",
    interactions: (n)=> n===1 ? "1 chat interaction" : `${n} chat interactions`,
    streak: (n)=> n===1 ? "🔥 1 day in a row studying" : `🔥 ${n} days in a row studying`,
    levels: {basic:"Basic level", intermediate:"Intermediate level", advanced:"Advanced level"},
    styles: {simple:"Simple explanation", detailed:"Detailed explanation", summary:"Direct summary", stepbystep:"Step by step"},
    imgStyles: {educational:"Educational", realistic:"Realistic", illustration:"Illustration", diagram:"Diagram", futuristic:"Futuristic"},
    subjects: {math:"Math",portuguese:"Portuguese",history:"History",geography:"Geography",science:"Science",biology:"Biology",physics:"Physics",chemistry:"Chemistry",english:"English",spanish:"Spanish",philosophy:"Philosophy",sociology:"Sociology",literature:"Literature",writing:"Writing",programming:"Programming",astronomy:"Astronomy"},
    langInstruction: "Respond in English."
  }
};

let lang = localStorage.getItem('cortex_lang');
const t = ()=> translations[lang];

// ---------------- ARMAZENAMENTO REAL DE PROGRESSO ----------------
const STORAGE_KEYS = {
  seconds: 'cortex_total_seconds',
  subjectCounts: 'cortex_subject_counts',
  exercises: 'cortex_exercises_done',
  lastVisit: 'cortex_last_visit_date',
  streak: 'cortex_streak_days'
};

function getSubjectCounts(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEYS.subjectCounts) || '{}'); }
  catch(e){ return {}; }
}

function incrementSubjectCount(subjectId){
  const counts = getSubjectCounts();
  counts[subjectId] = (counts[subjectId] || 0) + 1;
  localStorage.setItem(STORAGE_KEYS.subjectCounts, JSON.stringify(counts));
  refreshDashboardStats();
  renderProgressList();
}

function formatStudyTime(totalSeconds){
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  if(h > 0) return `${h}h${m.toString().padStart(2,'0')}`;
  if(m > 0) return `${m}min`;
  return `${totalSeconds}s`;
}

function todayStr(){ return new Date().toISOString().slice(0,10); }

function updateStreak(){
  const today = todayStr();
  const lastVisit = localStorage.getItem(STORAGE_KEYS.lastVisit);
  let streak = parseInt(localStorage.getItem(STORAGE_KEYS.streak) || '0', 10);

  if(lastVisit !== today){
    const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);
    streak = (lastVisit === yesterday) ? streak + 1 : 1;
    localStorage.setItem(STORAGE_KEYS.lastVisit, today);
    localStorage.setItem(STORAGE_KEYS.streak, streak);
  }
  document.getElementById('streakDisplay').textContent = t().streak(streak);
}

function refreshDashboardStats(){
  const seconds = parseInt(localStorage.getItem(STORAGE_KEYS.seconds) || '0', 10);
  const counts = getSubjectCounts();
  const studiedCount = Object.keys(counts).filter(id => counts[id] > 0).length;
  document.getElementById('statTime').textContent = formatStudyTime(seconds);
  document.getElementById('statSubjects').textContent = studiedCount;
  document.getElementById('statExercises').textContent = localStorage.getItem(STORAGE_KEYS.exercises) || '0';
  document.getElementById('statAccuracy').textContent = '—';
}

// Progresso por matéria = baseado em interações reais no chat, não em número aleatório
function renderProgressList(){
  const progressList = document.getElementById('progressList');
  progressList.innerHTML = '';
  const counts = getSubjectCounts();
  const studied = SUBJECT_IDS.filter(id => counts[id] > 0)
    .sort((a,b)=> counts[b] - counts[a]);

  if(studied.length === 0){
    const empty = document.createElement('div');
    empty.className = 'progress-empty';
    empty.textContent = t().progressEmpty;
    progressList.appendChild(empty);
    return;
  }

  studied.forEach(id=>{
    const count = counts[id];
    const pct = Math.min(100, count * 10); // cada interação = 10% até o teto de 100%
    const row = document.createElement('div');
    row.className = 'progress-row';
    row.innerHTML = `
      <div style="display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:6px;">
        <span>${EMOJIS[id]} ${t().subjects[id]}</span>
        <span class="progress-count">${t().interactions(count)}</span>
      </div>
      <div style="height:8px;background:var(--surface-2);border-radius:100px;overflow:hidden;">
        <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--accent),var(--violet));"></div>
      </div>`;
    progressList.appendChild(row);
  });
}

// Contabiliza o tempo real enquanto a aba estiver visível
let studySeconds = parseInt(localStorage.getItem(STORAGE_KEYS.seconds) || '0', 10);
setInterval(()=>{
  if(document.visibilityState === 'visible'){
    studySeconds++;
    localStorage.setItem(STORAGE_KEYS.seconds, studySeconds);
    const el = document.getElementById('statTime');
    if(el) el.textContent = formatStudyTime(studySeconds);
  }
}, 1000);

// ---------------- CONSTRUÇÃO DA UI (dependente do idioma) ----------------
function buildSubjectGrid(){
  const subjectGrid = document.getElementById('subjectGrid');
  subjectGrid.innerHTML = '';
  SUBJECT_IDS.forEach(id=>{
    const el = document.createElement('div');
    el.className='subject-card';
    el.innerHTML = `<span class="subject-emoji">${EMOJIS[id]}</span><div class="subject-name">${t().subjects[id]}</div>`;
    el.onclick = ()=>{ switchView('chat'); document.getElementById('cfgSubject').value = id; };
    subjectGrid.appendChild(el);
  });
}

function buildSelect(elId, ids, dict){
  const el = document.getElementById(elId);
  const currentValue = el.value;
  el.innerHTML = '';
  ids.forEach(id=>{
    const o = document.createElement('option');
    o.value = id;
    o.textContent = dict[id];
    el.appendChild(o);
  });
  if(ids.includes(currentValue)) el.value = currentValue;
}

function buildStyleChips(){
  const styleRow = document.getElementById('styleRow');
  const currentSelected = document.querySelector('.style-chip.selected')?.dataset.style || IMG_STYLE_IDS[0];
  styleRow.innerHTML = '';
  IMG_STYLE_IDS.forEach(id=>{
    const chip = document.createElement('div');
    chip.className = 'style-chip' + (id === currentSelected ? ' selected' : '');
    chip.dataset.style = id;
    chip.textContent = t().imgStyles[id];
    chip.onclick = ()=>{
      document.querySelectorAll('.style-chip').forEach(x=>x.classList.remove('selected'));
      chip.classList.add('selected');
    };
    styleRow.appendChild(chip);
  });
}

function applyTranslations(){
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.dataset.i18n;
    if(typeof t()[key] === 'string') el.innerHTML = t()[key];
  });
  document.getElementById('chatInput').placeholder = t().chatPlaceholder;
  document.getElementById('imgPrompt').placeholder = t().imgPlaceholder;
  document.getElementById('langBtnPt').classList.toggle('active', lang==='pt');
  document.getElementById('langBtnEn').classList.toggle('active', lang==='en');

  buildSubjectGrid();
  buildSelect('cfgSubject', SUBJECT_IDS, t().subjects);
  buildSelect('cfgLevel', LEVEL_IDS, t().levels);
  buildSelect('cfgStyle', STYLE_IDS, t().styles);
  buildStyleChips();
  renderProgressList();

  // Título da view atual
  const activeView = document.querySelector('.nav-item.active');
  if(activeView) document.getElementById('topbarTitle').textContent = t().titles[activeView.dataset.view];

  // Mensagem de boas-vindas do chat (só se ainda não houver histórico real)
  if(history.length === 0){
    messagesEl.innerHTML = '';
    addMsg(t().chatWelcome, 'ai');
  }
}

function setLanguage(newLang){
  lang = newLang;
  localStorage.setItem('cortex_lang', lang);
  applyTranslations();
}

document.querySelectorAll('.lang-btn').forEach(btn=>{
  btn.onclick = ()=>{
    setLanguage(btn.dataset.lang);
    document.getElementById('langOverlay').style.display = 'none';
  };
});
document.getElementById('langBtnPt').onclick = ()=> setLanguage('pt');
document.getElementById('langBtnEn').onclick = ()=> setLanguage('en');

// Navigation
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelector(`.nav-item[data-view="${name}"]`).classList.add('active');
  document.getElementById('topbarTitle').textContent = t().titles[name];
  document.getElementById('sidebar').classList.remove('open');
}
document.querySelectorAll('.nav-item').forEach(n=>{
  n.addEventListener('click', ()=>switchView(n.dataset.view));
});
document.getElementById('menuBtn').onclick = ()=>document.getElementById('sidebar').classList.toggle('open');

// Geração real de imagem via backend (/api/generate-image)
document.getElementById('genBtn').onclick = async ()=>{
  const promptText = document.getElementById('imgPrompt').value.trim();
  const styleChip = document.querySelector('.style-chip.selected');
  const styleId = styleChip ? styleChip.dataset.style : IMG_STYLE_IDS[0];
  const preview = document.getElementById('imgPreview');
  const genBtn = document.getElementById('genBtn');
  if(!promptText){ return; }

  const fullPrompt = `${promptText}, ${t().imgStyles[styleId].toLowerCase()} style, high quality`;
  genBtn.disabled = true;
  preview.innerHTML = `<div>${t().imgGenerating(promptText)}</div>`;

  try{
    const res = await fetch('/api/generate-image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: fullPrompt })
    });
    const data = await res.json();
    if(!res.ok || !data.image){
      preview.innerHTML = `<div style="color:var(--amber)">${data.error || t().imgGenericError}</div>`;
    } else {
      preview.innerHTML = `<img src="${data.image}" style="width:100%;height:100%;object-fit:cover;border-radius:16px;">`;
    }
  }catch(err){
    preview.innerHTML = `<div style="color:var(--amber)">${t().imgConnError}</div>`;
  }finally{
    genBtn.disabled = false;
  }
};

// Chat
const messagesEl = document.getElementById('messages');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
let history = [];

function addMsg(text, cls){
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  messagesEl.appendChild(d);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return d;
}

async function sendMessage(){
  const text = chatInput.value.trim();
  if(!text) return;
  const subjectId = document.getElementById('cfgSubject').value || SUBJECT_IDS[0];
  const levelId = document.getElementById('cfgLevel').value || LEVEL_IDS[0];
  const styleId = document.getElementById('cfgStyle').value || STYLE_IDS[0];

  addMsg(text, 'user');
  incrementSubjectCount(subjectId);
  history.push({role:'user', content: text});
  chatInput.value = '';
  sendBtn.disabled = true;
  const loadingEl = addMsg(t().thinking, 'ai loading');

  const subjectName = t().subjects[subjectId];
  const levelName = t().levels[levelId];
  const styleName = t().styles[styleId];
  const systemPrompt = `Você é a IA de estudos da plataforma Cortex. O aluno está estudando "${subjectName}", no ${levelName.toLowerCase()}, e pediu o estilo: ${styleName.toLowerCase()}. ${t().langInstruction} Seja claro, didático e adaptado a esse nível e estilo. Pode incluir exercícios, resumos ou explicações passo a passo quando fizer sentido.`;

  try{
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ systemPrompt, messages: history })
    });
    const data = await response.json();
    loadingEl.remove();
    if(!response.ok || !data.reply){
      addMsg(data.error || t().chatNoReply, 'ai');
    } else {
      addMsg(data.reply, 'ai');
      history.push({role:'assistant', content: data.reply});
    }
  }catch(err){
    loadingEl.remove();
    addMsg(t().chatError, 'ai');
  }finally{
    sendBtn.disabled = false;
  }
}
sendBtn.onclick = sendMessage;
chatInput.addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});

// ---------------- INICIALIZAÇÃO ----------------
updateStreak();
refreshDashboardStats();

if(lang){
  document.getElementById('langOverlay').style.display = 'none';
  applyTranslations();
} else {
  // Mostra o overlay de idioma; a UI só é totalmente montada depois da escolha
  lang = 'pt'; // valor temporário só para não quebrar leituras de t() antes da escolha
}
</script>
</body>
</html>
